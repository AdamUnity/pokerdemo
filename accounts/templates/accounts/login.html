{% extends 'base.html' %}
{% block title %}Logowanie — Royal Poker{% endblock %}
{% block content %}
<div style="max-width:460px;margin:0 auto;">
    <div class="card">
        <div style="text-align:center;margin-bottom:32px;">
            <div style="font-size:9px;letter-spacing:6px;color:#6a5525;margin-bottom:10px;font-weight:600;">WITAJ PONOWNIE</div>
            <h2 style="font-size:30px;letter-spacing:1px;margin-bottom:6px;">Zaloguj się</h2>
            <div style="font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:#4a3e20;">do swojego konta gracza</div>
        </div>
        {% if error %}<p style="color:#8b2020;font-size:12px;text-align:center;margin-bottom:16px;letter-spacing:1px;">{{ error }}</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <label>LOGIN</label>
            <input type="text" name="username" placeholder="Wpisz swój login">
            <label>HASŁO</label>
            <input type="password" name="password" placeholder="••••••••">
            <button type="submit" class="btn" style="width:100%;margin-top:8px;">ZALOGUJ SIĘ</button>
        </form>
        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-txt">LUB</div>
            <div class="divider-line"></div>
        </div>
        <div style="text-align:center;font-size:12px;color:#3a3020;letter-spacing:1px;">
            Nie masz konta? &nbsp;<a href="/accounts/register/" style="color:#d4af6a;text-decoration:none;">Zarejestruj się</a>
        </div>
    </div>
</div>
{% endblock %}
