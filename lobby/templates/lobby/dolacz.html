{% extends 'base.html' %}
{% block title %}Dołącz do gry — Royal Poker{% endblock %}
{% block content %}
<div style="max-width:460px;margin:0 auto;">
    <div class="card">
        <div style="text-align:center;margin-bottom:32px;">
            <div style="font-size:9px;letter-spacing:6px;color:#6a5525;margin-bottom:10px;font-weight:600;">DOŁĄCZ DO GRY</div>
            <h2 style="font-size:28px;">Wpisz kod pokoju</h2>
        </div>
        {% if error %}<p style="color:#8b2020;font-size:12px;text-align:center;margin-bottom:16px;letter-spacing:1px;">{{ error }}</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <label>KOD POKOJU</label>
            <input type="text" name="kod" placeholder="np. AB12CD" maxlength="6" style="text-transform:uppercase;letter-spacing:4px;font-size:20px;text-align:center;">
            <button type="submit" class="btn" style="width:100%;margin-top:8px;">DOŁĄCZ</button>
        </form>
        <div style="text-align:center;margin-top:20px;">
            <a href="/" style="font-size:11px;letter-spacing:3px;color:#6a5525;text-decoration:none;">← POWRÓT</a>
        </div>
    </div>
</div>
{% endblock %}
