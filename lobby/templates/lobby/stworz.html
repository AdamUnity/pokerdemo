{% extends 'base.html' %}
{% block title %}Stwórz pokój — Royal Poker{% endblock %}
{% block content %}
<div style="max-width:460px;margin:0 auto;">
    <div class="card">
        <div style="text-align:center;margin-bottom:32px;">
            <div style="font-size:9px;letter-spacing:6px;color:#6a5525;margin-bottom:10px;font-weight:600;">NOWA GRA</div>
            <h2 style="font-size:28px;">Stwórz pokój</h2>
            <div style="font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:#4a3e20;margin-top:6px;">Twoje punkty: {{ request.user.points }}</div>
        </div>
        {% if error %}
        <p style="color:#8b2020;font-size:12px;text-align:center;margin-bottom:16px;letter-spacing:1px;">{{ error }}</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label>MINIMALNE PUNKTY DO WEJŚCIA</label>
            <input type="number" name="min_punkty" value="100" min="10" max="{{ request.user.points }}"
                style="width:100%;background:#0c0a06;border:1px solid #241e0c;color:#d4af6a;
                padding:15px 18px;font-family:'Montserrat',sans-serif;font-size:20px;
                letter-spacing:2px;box-sizing:border-box;outline:none;border-radius:2px;
                text-align:center;font-weight:600;margin-bottom:8px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:24px;">
                <span style="font-size:10px;color:#3a3020;letter-spacing:1px;">Min: 10</span>
                <span style="font-size:10px;color:#3a3020;letter-spacing:1px;">Max: {{ request.user.points }}</span>
            </div>
            <button type="submit" class="btn" style="width:100%;">STWÓRZ POKÓJ</button>
        </form>
        <div style="text-align:center;margin-top:20px;">
            <a href="/" style="font-size:11px;letter-spacing:3px;color:#6a5525;text-decoration:none;">← POWRÓT</a>
        </div>
    </div>
</div>
{% endblock %}
